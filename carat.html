<title>Five Carat</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one rhinestone card on the spark field; a 6x5 board of jewel tiles, then a keyboard.
   Gold = right letter, right spot. Pink = in the word, wrong spot. Mauve = not in the word. */
:root {
  color-scheme: light;
  --ground: #c9156d;
  --blush: #fff0f7;
  --petal: #ffc2df;
  --pink: #ff6fb5;
  --rose: #e6338a;
  --berry: #7a1f5c;
  --lilac: #b7a6ff;
  --gold: #e9b949;
  --ink: #5a1847;
  --muted: #a3628f;
  --font-script: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --font-title: "Monsieur La Doulaise", "Snell Roundhand", "Edwardian Script ITC", cursive;
  --font-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --font-body: "Josefin Sans", "Futura", "Avenir Next", system-ui, sans-serif;
  --font-ui: "Josefin Sans", "Futura", "Avenir Next", system-ui, sans-serif;
  --glitter: none;
}
* { box-sizing: border-box; }
html { background: var(--ground); }
body {
  color: var(--ink); font-family: var(--font-body); font-weight: 400; font-size: 15px; letter-spacing: .02em; line-height: 1.5;
  background-color: var(--ground);
  background-image: radial-gradient(1000px 700px at 50% 20%, #e5358b, #c9156d 70%);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px 56px;
  overflow-x: hidden;
}
#glitter { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#burst { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

/* Card trimmed in a band of rhinestones */
.lace {
  position: relative; z-index: 1; max-width: 580px; margin: 0 auto;
  padding: 14px; border-radius: 40px;
  background:
    radial-gradient(circle at 40% 40%, #fff 0 1.4px, transparent 1.8px),
    radial-gradient(circle, #ffe6f3 0 4px, #ff8fc6 4.6px 5.4px, transparent 6px),
    linear-gradient(135deg, #ff5fae, #e6338a);
  background-size: 14px 14px, 14px 14px, auto;
  background-position: 0 0, 0 0, 0 0;
  box-shadow: 0 0 0 2px #fff, 0 0 0 5px #ff8fc6, 0 0 36px rgba(255,255,255,.55), 0 24px 50px rgba(90, 0, 50, .45);
}
.card {
  background: linear-gradient(180deg, rgba(255,255,255,.97) 0%, rgba(255,240,247,.97) 100%);
  border-radius: 28px;
  box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px var(--petal);
  padding: 36px 26px 30px;
  display: flex; flex-direction: column; gap: 20px;
  position: relative;
}

header { text-align: center; display: grid; gap: 2px; }
h1 {
  margin: 6px 0 0; padding: .12em .2em .18em; font-family: var(--font-title); font-style: normal; font-weight: 400; line-height: 1;
  font-size: clamp(58px, 15vw, 104px); letter-spacing: 0; text-wrap: balance;
  color: var(--rose);
  background-image: var(--glitter), linear-gradient(100deg, var(--rose), var(--pink) 45%, #ff9fcf 55%, var(--rose));
  background-size: 160px 160px, 100% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: glint-text 5s linear infinite;
  filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 0 1px rgba(122,31,92,.35));
}
@keyframes glint-text { to { background-position: 160px 160px, 0 0; } }
.divider { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--pink); font-size: 14px; }
.divider::before, .divider::after { content: ""; flex: 0 1 90px; height: 6px;
  background: radial-gradient(circle, var(--pink) 1.6px, transparent 2px) 0 50% / 8px 6px repeat-x; }
.tag { margin: 0 auto; max-width: 42ch; color: var(--muted); font-size: 14px; text-align: center; }

.btns { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
button {
  font: 400 12px var(--font-ui); text-transform: uppercase; letter-spacing: .22em; cursor: pointer; border-radius: 999px; padding: 10px 18px 8px;
  color: var(--berry); background: #fff; border: 2px solid var(--petal);
  box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--petal);
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--pink); box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--pink); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lilac); outline-offset: 4px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.msg { min-height: 22px; text-align: center; font-size: 14px; color: var(--rose); margin-top: -8px; }
.msg.err { color: #c0174f; }
.banner { background: #fff; border: 2px dashed var(--rose); color: var(--berry); border-radius: 16px; padding: 12px 16px; font-size: 14px; text-align: center; }
.confirm { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--berry); }
.confirm .danger { border-color: var(--rose); color: var(--rose); }
.win {
  border-radius: 22px; padding: 20px; text-align: center; display: grid; gap: 6px;
  background: linear-gradient(135deg, #fffaf0, #ffe9f5); border: 2px dashed var(--gold);
  box-shadow: 0 0 0 6px #fff, 0 0 0 8px var(--gold);
}
.win h2 { font-family: var(--font-script); font-style: italic; font-weight: 400; font-size: 38px; line-height: 1.05; margin: 0; color: var(--rose); }
.win p { margin: 0; color: var(--muted); }
@media (max-width: 480px) {
  .lace { padding: 10px; border-radius: 32px; }
  .card { padding: 28px 14px 22px; border-radius: 24px; }
}
@media (prefers-reduced-motion: reduce) { h1 { animation: none; } }

/* Link back to the parlor */
.home {
  position: absolute; top: 14px; left: 16px; z-index: 2;
  font: 400 10px var(--font-ui); letter-spacing: .26em; text-transform: uppercase; text-decoration: none;
  color: var(--rose); padding: 6px 10px 4px; border-radius: 999px; border: 1.5px solid var(--petal); background: #fff;
}
.home:hover { border-color: var(--pink); }
.home:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.cta {
  color: #fff; border: 2px solid #fff; font-weight: 600;
  background-image: var(--glitter), linear-gradient(135deg, var(--pink), var(--rose));
  background-size: 100px 100px, 100% 100%;
  box-shadow: 0 0 0 2px var(--rose), 0 6px 16px rgba(230,51,138,.35);
  text-shadow: 0 1px 2px rgba(122,31,92,.5);
}
.cta:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--rose), 0 8px 20px rgba(230,51,138,.45); }

/* ---------- Difficulty: stars hanging from the ceiling ---------- */
.pick-label { text-align: center; margin-bottom: -10px; }
.ceiling { position: relative; display: flex; justify-content: center; align-items: flex-start; gap: clamp(26px, 10vw, 70px); padding-top: 4px; min-height: 124px; }
.ceiling::before {
  content: ""; position: absolute; top: 0; left: 4%; right: 4%; height: 8px; border-radius: 999px;
  background: radial-gradient(circle, #fff 0 1.7px, transparent 2.1px) 0 50% / 12px 8px repeat-x, linear-gradient(90deg, var(--petal), var(--pink), var(--petal));
  box-shadow: 0 2px 6px rgba(230,51,138,.25);
}
.ceiling .hang {
  position: relative; display: flex; flex-direction: column; align-items: center; padding: 0; margin-top: 6px;
  background: none !important; border: none !important; box-shadow: none !important; border-radius: 0;
  text-transform: none; letter-spacing: normal; transform-origin: 50% 0; animation: sway 4.2s ease-in-out infinite;
}
.hang .string { width: 1.5px; height: var(--len); background: linear-gradient(var(--gold), var(--petal)); }
.hang .hstar { width: 42px; height: 42px; margin-top: -3px; transition: transform .35s cubic-bezier(.3,1.6,.5,1), filter .35s; overflow: visible; }
.hang .hstar .body { fill: #ffe6f2; stroke: #ff8fc6; stroke-width: 1.6; stroke-linejoin: round; transition: fill .35s, stroke .35s; }
.hang .hstar .facet { fill: none; stroke: #fff; stroke-width: 1; opacity: .85; }
.hang .name { margin-top: 5px; font: 600 11px var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.hang .pips { font-size: 9px; letter-spacing: 2px; color: var(--petal); line-height: 1.4; }
.hang:hover .hstar { transform: scale(1.08) rotate(-8deg); }
.hang.on .hstar { transform: scale(1.24); filter: drop-shadow(0 0 6px rgba(255,214,110,.95)) drop-shadow(0 0 14px rgba(255,111,181,.6)); }
.hang.on .hstar .body { fill: #f7cf63; stroke: #e6338a; }
.hang.on .name { color: var(--rose); }
.hang.on .pips { color: var(--gold); }
.ceiling .hang.tug { animation: tug .75s cubic-bezier(.3,1.5,.5,1), sway 4.2s ease-in-out .75s infinite; }
.hang:focus-visible { outline: 3px solid var(--lilac); outline-offset: 4px; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes tug { 0% { transform: translateY(0); } 30% { transform: translateY(12px); } 100% { transform: translateY(0); } }
.lvl-note { margin: -10px auto 0; text-align: center; font-size: 13px; color: var(--berry); max-width: 46ch; min-height: 1.5em; }
@media (prefers-reduced-motion: reduce) { .ceiling .hang, .ceiling .hang.tug { animation: none; } }

.card { gap: 16px; }
.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 7px; width: min(100%, 330px); margin: 0 auto; }
.brow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.brow.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.tile {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font: 500 clamp(24px, 7vw, 32px) var(--font-display); text-transform: uppercase; color: var(--berry);
  background: #fff; border: 2px solid #f6d3e5; border-radius: 12px;
  box-shadow: inset 0 -3px 0 rgba(255,194,223,.35);
  perspective: 400px;
}
.tile.filled { border-color: var(--pink); animation: pop .12s; }
@keyframes pop { 50% { transform: scale(1.08); } }
.tile.reveal { animation: flip .5s ease both; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.tile.gold, .key.gold {
  color: #5a3a00; border-color: #fff;
  background-image: var(--glitter), linear-gradient(135deg, #fff1c2, var(--gold) 55%, #c9952e);
  background-size: 80px 80px, 100% 100%;
  box-shadow: 0 0 0 2px var(--gold), 0 4px 10px rgba(233,185,73,.4);
}
.tile.pinkish, .key.pinkish {
  color: #fff; border-color: #fff;
  background-image: var(--glitter), linear-gradient(135deg, var(--pink), var(--rose));
  background-size: 80px 80px, 100% 100%;
  box-shadow: 0 0 0 2px var(--rose);
  text-shadow: 0 1px 2px rgba(122,31,92,.4);
}
.tile.none, .key.none { color: #fff; background: #c7aabb; border-color: #c7aabb; box-shadow: none; }
.keys { display: grid; gap: 6px; width: 100%; max-width: 480px; margin: 0 auto; }
.krow { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; height: 50px; padding: 0; border-radius: 10px; letter-spacing: 0;
  font: 600 15px var(--font-ui); text-transform: uppercase; color: var(--berry);
  background: #fff; border: 1.5px solid var(--petal); box-shadow: 0 2px 0 var(--petal);
}
.key.wide { flex: 1.6 1 0; font-size: 10px; letter-spacing: .12em; }
.key:hover:not(:disabled) { transform: none; box-shadow: 0 2px 0 var(--pink); }
.legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.streak { text-align: center; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 400px) { .key { height: 46px; font-size: 13px; } .krow { gap: 4px; } }
@media (prefers-reduced-motion: reduce) { .tile.reveal, .tile.filled, .brow.shake { animation: none; } }
</style>

      <span><i style="background:var(--gold)"></i>Right spot</span>
      <span><i style="background:var(--rose)"></i>Wrong spot</span>
      <span><i style="background:#c7aabb"></i>Not in word</span>
    </div>
    <div id="board" class="board" aria-label="Guesses"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div id="win" class="win" hidden></div>
    <div id="keys" class="keys"></div>
    <div class="btns"><button id="newgame" type="button">New word</button></div>
    <div class="streak" id="streak"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement;

/* ---------- Glitter texture for text, meter, buttons ---------- */
(function glitterTexture() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 160;
    const g = c.getContext("2d");
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * 160, y = Math.random() * 160, r = Math.random() * 1.3 + .3;
      const pal = ["rgba(255,255,255,.95)", "rgba(255,255,255,.6)", "rgba(255,241,194,.9)", "rgba(255,190,225,.8)", "rgba(122,31,92,.25)"];
      g.fillStyle = pal[Math.floor(Math.random() * pal.length)];
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    root.style.setProperty("--glitter", `url(${c.toDataURL()})`);
  } catch {}
})();

/* ---------- Sequin field + starburst glints + sparkle bursts ---------- */
const field = $("glitter"), fctx = field.getContext("2d");
const burst = $("burst"), bctx = burst.getContext("2d");
let seqs = [], glints = [], parts = [], dpr = 1, sprites = [];
const GAP = 14, SR = 5.6;
// Sequin sprites from deep pink (level 0) to bright white (level 5)
const SPARK_SHADES = [
  ["#d81b78", "#b5145f"], ["#e5358b", "#bd176a"], ["#f165a6", "#c81d73"],
  ["#f99acb", "#d42a80"], ["#ffd2ea", "#e23d90"], ["#ffffff", "#f070b0"]
];
const SPR = 16; // sprite half-size in CSS px (sparks can reach past their grid cell)
function sparkPath(g, cx, cy, R, w) { // skinny four-point spark
  g.beginPath();
  g.moveTo(cx, cy - R); g.lineTo(cx + w, cy - w); g.lineTo(cx + R * .8, cy); g.lineTo(cx + w, cy + w);
  g.lineTo(cx, cy + R); g.lineTo(cx - w, cy + w); g.lineTo(cx - R * .8, cy); g.lineTo(cx - w, cy - w);
  g.closePath();
}
function makeSprites() {
  sprites = SPARK_SHADES.map(([face], i) => {
    const c = document.createElement("canvas"); const S = Math.ceil(SPR * 2 * dpr);
    c.width = c.height = S; const g = c.getContext("2d"); g.scale(dpr, dpr);
    const m = SPR, R = SR * (0.9 + i * .22), w = Math.max(.7, R * .13);
    if (i >= 4) { // bright sparks get a soft halo
      const halo = g.createRadialGradient(m, m, 0, m, m, R * .7);
      halo.addColorStop(0, "rgba(255,255,255,.75)"); halo.addColorStop(1, "rgba(255,210,235,0)");
      g.fillStyle = halo; g.beginPath(); g.arc(m, m, R * .7, 0, 6.283); g.fill();
    }
    g.fillStyle = face; sparkPath(g, m, m, R, w); g.fill();
    if (i >= 3) { g.fillStyle = "#fff"; g.beginPath(); g.arc(m, m, w * .9, 0, 6.283); g.fill(); }
    return c;
  });
}
function size() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  for (const c of [field, burst]) { c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
  makeSprites();
  seqs = [];
  for (let y = GAP / 2, row = 0; y < innerHeight + GAP; y += GAP * .87, row++)
    for (let x = (row % 2 ? GAP : GAP / 2); x < innerWidth + GAP; x += GAP)
      seqs.push({ x: x + (Math.random() - .5) * 4, y: y + (Math.random() - .5) * 4, j: Math.random(), ph: Math.random() * 6.28, k: .55 + Math.random() * .75 });
  glints = [];
}
function shine(x, y, s) { // smooth drifting patches of light, like light catching sequins
  return Math.sin(x * .011 + s * .35) + Math.sin(y * .015 - s * .27) + Math.sin((x - y) * .008 + s * .2) + Math.sin((x + y) * .006 - s * .15);
}
function starburst(ctx, x, y, r, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .22);
  glow.addColorStop(0, "rgba(255,255,255,1)"); glow.addColorStop(.3, "rgba(255,240,250,.7)"); glow.addColorStop(1, "rgba(255,200,230,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * .22, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#fff";
  // Long skinny cross, shorter skinny diagonals: a sharp, needle-like spark
  const rays = [[0, 1], [Math.PI / 2, .8], [Math.PI / 4, .38], [-Math.PI / 4, .38]];
  for (const [ang, len] of rays) {
    ctx.save(); ctx.rotate(ang);
    const L = r * len, w = Math.max(.45, r * .016);
    ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(0, -w); ctx.lineTo(L, 0); ctx.lineTo(0, w); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function star(ctx, x, y, r, color, a) {
  ctx.globalAlpha = a; ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
let lastSeq = -1;
function frame(t) {
  const s = t / 1000;
  if (REDUCED || t - lastSeq > 60) { // sequins at ~16fps is plenty and keeps it light
    lastSeq = t;
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.fillStyle = "#c9156d"; fctx.fillRect(0, 0, field.width, field.height);
    for (const q of seqs) {
      let v = shine(q.x, q.y, s) + (q.j - .5) * 2.2 + Math.sin(s * 2 + q.ph) * .35;
      const lvl = v > 2.2 ? 5 : v > 1.6 ? 4 : v > 1.0 ? 3 : v > 0 ? 2 : v > -1.2 ? 1 : 0;
      const half = SPR * q.k * dpr;
      fctx.drawImage(sprites[lvl], q.x * dpr - half, q.y * dpr - half, half * 2, half * 2);
    }
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Mostly small sparks with the occasional big one
    const sparkSize = () => { const k = Math.random(); return k < .55 ? 8 + Math.random() * 14 : k < .88 ? 24 + Math.random() * 26 : 60 + Math.random() * 50; };
    if (!REDUCED && glints.length < Math.min(26, innerWidth * innerHeight / 35000) && Math.random() < .4) {
      glints.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: sparkSize(), born: s, life: 1 + Math.random() * 2 });
    }
    if (REDUCED && !glints.length) for (let i = 0; i < 16; i++) glints.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: sparkSize(), born: s, life: 1e9 });
    glints = glints.filter(g => s - g.born < g.life);
    for (const g of glints) {
      const k = REDUCED ? .5 : (s - g.born) / g.life, a = Math.sin(k * Math.PI);
      starburst(fctx, g.x, g.y, g.r * (.5 + .5 * a), a);
    }
    fctx.globalAlpha = 1;
  }
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0); bctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    if (p.kind === "ring") {
      p.life--; p.r += p.vr; p.vr *= .93;
      bctx.globalAlpha = Math.max(0, p.life / p.max) * .9; bctx.strokeStyle = p.c; bctx.lineWidth = p.w;
      bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, 6.283); bctx.stroke();
      continue;
    }
    p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.life--; p.rot += .15;
    if (p.kind === "star") star(bctx, p.x, p.y, p.r * (.6 + .4 * Math.sin(p.rot)), p.c, Math.min(1, p.life / 30));
    else { bctx.globalAlpha = Math.min(1, p.life / 30); bctx.fillStyle = p.c; bctx.beginPath(); bctx.arc(p.x, p.y, p.r * .4, 0, 6.283); bctx.fill(); }
  }
  bctx.globalAlpha = 1;
  if (!REDUCED) requestAnimationFrame(frame);
}
addEventListener("resize", () => { if (REDUCED) requestAnimationFrame(frame); });
function sparkleAt(el, count) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#ff6fb5", "#e6338a", "#fff1c2", "#e9b949", "#ffffff", "#b7a6ff"];
  for (let i = 0; i < count; i++) {
    const a = Math.random() * 6.28, v = 1.5 + Math.random() * 6;
    parts.push({ x: cx + (Math.random() - .5) * r.width * .6, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2.5,
      r: 3 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)], life: 50 + Math.random() * 50,
      rot: Math.random() * 6, kind: Math.random() < .55 ? "star" : "dot" });
  }
}
addEventListener("resize", size);
size(); requestAnimationFrame(frame);


/* ---------- Magic wand: sparks wherever you click or tap ---------- */
function wandAt(x, y) {
  if (REDUCED) return;
  parts.push({ kind: "ring", x, y, r: 3, vr: 4.2, w: 2.2, life: 24, max: 24, c: "#ffffff" });
  parts.push({ kind: "ring", x, y, r: 1, vr: 2.6, w: 1.4, life: 30, max: 30, c: "#ff9fcf" });
  const colors = ["#ffffff", "#ffffff", "#fff1c2", "#e9b949", "#ff6fb5", "#ffb3d9", "#b7a6ff"];
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * 6.283, v = 1.5 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, r: 2.5 + Math.random() * 5,
      c: colors[Math.floor(Math.random() * colors.length)], life: 28 + Math.random() * 30, rot: Math.random() * 6, kind: Math.random() < .65 ? "star" : "dot" });
  }
  for (let i = 0; i < 7; i++) { // lingering glitter that drifts down like fairy dust
    parts.push({ x: x + (Math.random() - .5) * 30, y: y + (Math.random() - .5) * 20, vx: (Math.random() - .5) * .8, vy: -1 - Math.random(),
      r: 2 + Math.random() * 3, c: colors[Math.floor(Math.random() * colors.length)], life: 70 + Math.random() * 40, rot: Math.random() * 6, kind: "star" });
  }
}
addEventListener("pointerdown", e => wandAt(e.clientX, e.clientY), { capture: true, passive: true });

/* ---------- Difficulty picker: stars hanging from the ceiling ---------- */
function starCeiling(mount, levels, current, onPick) {
  const LENS = [26, 50, 36];
  mount.className = "ceiling"; mount.setAttribute("role", "radiogroup"); mount.setAttribute("aria-label", "Difficulty");
  const note = document.createElement("p"); note.className = "lvl-note"; note.setAttribute("aria-live", "polite");
  mount.insertAdjacentElement("afterend", note);
  let cur = current;
  const btns = levels.map((lv, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "hang"; b.setAttribute("role", "radio");
    b.style.setProperty("--len", LENS[i % LENS.length] + "px"); b.style.animationDelay = (-i * 1.4) + "s";
    b.innerHTML = '<span class="string"></span><svg class="hstar" viewBox="0 0 40 40" aria-hidden="true"><path class="body" d="M20.0 4.5 L24.3 15.5 L36.2 16.2 L27.0 23.8 L30.0 35.3 L20.0 28.9 L10.0 35.3 L13.0 23.8 L3.8 16.2 L15.7 15.5 Z"/><path class="facet" d="M20 21.5 L20.0 4.5 M20 21.5 L36.2 16.2 M20 21.5 L30.0 35.3 M20 21.5 L10.0 35.3 M20 21.5 L3.8 16.2"/></svg><span class="name"></span><span class="pips"></span>';
    b.querySelector(".name").textContent = lv.name;
    b.querySelector(".pips").textContent = "\u2605".repeat(i + 1);
    b.setAttribute("aria-label", lv.name + ": " + lv.note);
    b.onclick = () => {
      b.classList.remove("tug"); void b.offsetWidth; b.classList.add("tug");
      if (lv.id === cur) return;
      cur = lv.id; update(); onPick(lv.id);
    };
    mount.append(b); return b;
  });
  function update() {
    btns.forEach((b, i) => { const on = levels[i].id === cur; b.classList.toggle("on", on); b.setAttribute("aria-checked", on ? "true" : "false"); });
    const lv = levels.find(l => l.id === cur); note.textContent = lv ? lv.note : "";
  }
  update();
  return { set(id) { cur = id; update(); } };
}
function loadLevel(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } }
function saveLevel(key, id) { try { localStorage.setItem(key, id); } catch {} }

for (const w of ANSWERS) DICT.add(w);
function isWord(w) {
  if (DICT.has(w)) return true;
  if (w.endsWith("s") && DICT4.has(w.slice(0, 4))) return true;           // plurals: shoes, bows
  if (w.endsWith("ed") && (DICT4.has(w.slice(0, 3) + "e") || DICT.has(w.slice(0, 3)))) return true;
  if (w.endsWith("d") && DICT4.has(w.slice(0, 4)) && w[3] === "e") return true; // baked, faded
  if (w.endsWith("er") && DICT4.has(w.slice(0, 3) + "e")) return true;
  if (w.endsWith("y") && DICT4.has(w.slice(0, 4))) return true;           // dusty, sandy
  return false;
}
const KEY = "five-carat-v1";
let st = null;
const LEN = 5;
const LEVELS = [
  { id: "easy", name: "Easy", tries: 8, note: "Eight tries to find the word." },
  { id: "medium", name: "Medium", tries: 6, note: "Six tries, the classic way." },
  { id: "hard", name: "Hard", tries: 5, strict: true, note: "Five tries. Gold letters must stay in place and pink letters must be reused." }
];
const LVL_KEY = "five-carat-level";
let level = loadLevel(LVL_KEY, "medium");
const rows = () => (LEVELS.find(l => l.id === st.level) || LEVELS[1]).tries;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
function fresh(prev) {
  let a; do { a = ANSWERS[Math.floor(Math.random() * ANSWERS.length)]; } while (prev && a === prev.answer);
  return { answer: a, level, guesses: [], current: "", over: false, won: false, streak: prev ? prev.streak : 0, best: prev ? prev.best : 0 };
}
function score(guess, answer) {
  const res = Array(LEN).fill("none"), left = {};
  for (let i = 0; i < LEN; i++) { if (guess[i] === answer[i]) res[i] = "gold"; else left[answer[i]] = (left[answer[i]] || 0) + 1; }
  for (let i = 0; i < LEN; i++) if (res[i] !== "gold" && left[guess[i]]) { res[i] = "pinkish"; left[guess[i]]--; }
  return res;
}
function setMsg(t, err) { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); }

const board = $("board"); let tiles = [];
function buildBoard() {
  board.replaceChildren(); tiles = [];
  const n = rows();
  board.style.gridTemplateRows = `repeat(${n}, 1fr)`;
  board.style.width = n > 6 ? "min(100%, 290px)" : "";
  for (let r = 0; r < n; r++) {
    const row = document.createElement("div"); row.className = "brow"; tiles.push([]);
    for (let c = 0; c < LEN; c++) { const t = document.createElement("div"); t.className = "tile"; row.append(t); tiles[r].push(t); }
    board.append(row);
  }
}
const LAYOUT = ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"];
const keyEls = {};
for (const line of LAYOUT) {
  const row = document.createElement("div"); row.className = "krow";
  for (const ch of line) {
    const b = document.createElement("button"); b.type = "button"; b.className = "key";
    if (ch === "+") { b.textContent = "Enter"; b.classList.add("wide"); b.onclick = () => press("Enter"); }
    else if (ch === "-") { b.textContent = "⌫"; b.setAttribute("aria-label", "Delete"); b.classList.add("wide"); b.style.fontSize = "18px"; b.onclick = () => press("Backspace"); }
    else { b.textContent = ch; b.onclick = () => press(ch); keyEls[ch] = b; }
    row.append(b);
  }
  $("keys").append(row);
}

function render(revealRow) {
  if (tiles.length !== rows()) buildBoard();
  for (let r = 0; r < tiles.length; r++) for (let c = 0; c < LEN; c++) {
    const t = tiles[r][c], g = st.guesses[r];
    let ch = "", cls = "tile";
    if (g) { ch = g[c]; cls += " " + score(g, st.answer)[c]; if (r === revealRow) { cls += " reveal"; t.style.animationDelay = (c * 0.12) + "s"; } else t.style.animationDelay = ""; }
    else if (r === st.guesses.length && st.current[c]) { ch = st.current[c]; cls += " filled"; }
    t.textContent = ch; t.className = cls;
  }
  const rank = { none: 1, pinkish: 2, gold: 3 }, best = {};
  for (const g of st.guesses) score(g, st.answer).forEach((s, i) => { if ((rank[s] || 0) > (rank[best[g[i]]] || 0)) best[g[i]] = s; });
  for (const [ch, el] of Object.entries(keyEls)) el.className = "key" + (best[ch] ? " " + best[ch] : "");
  const win = $("win");
  if (st.over) {
    win.hidden = false; win.replaceChildren();
    const h = document.createElement("h2"), p = document.createElement("p");
    h.textContent = st.won ? "Flawless!" : `It was “${st.answer}”`;
    p.textContent = st.won ? `You found “${st.answer}” in ${st.guesses.length} ${st.guesses.length === 1 ? "try" : "tries"}.` : "Better luck with the next gem.";
    const b = document.createElement("button"); b.type = "button"; b.className = "cta"; b.textContent = "✦ Next word"; b.style.justifySelf = "center"; b.style.marginTop = "8px";
    b.onclick = newGame; win.append(h, p, b);
  } else win.hidden = true;
  $("streak").textContent = `Win streak ${st.streak} · Best ${st.best}`;
}

function press(k) {
  if (st.over) return;
  if (k === "Enter") return submit();
  if (k === "Backspace") { st.current = st.current.slice(0, -1); render(); return; }
  if (/^[a-z]$/.test(k) && st.current.length < LEN) { st.current += k; setMsg(""); render(); }
}
function submit() {
  const g = st.current, row = board.children[st.guesses.length];
  if (g.length < LEN) { setMsg("Not enough letters.", true); shake(row); return; }
  if (!isWord(g)) { setMsg(`“${g}” isn't in my word list.`, true); shake(row); return; }
  const rule = (LEVELS.find(l => l.id === st.level) || {}).strict ? hardRule(g) : "";
  if (rule) { setMsg(rule, true); shake(row); return; }
  st.guesses.push(g); st.current = "";
  const r = st.guesses.length - 1;
  if (g === st.answer) { st.over = true; st.won = true; st.streak++; st.best = Math.max(st.best, st.streak); }
  else if (st.guesses.length === rows()) { st.over = true; st.streak = 0; }
  save(); render(r);
  const golds = score(g, st.answer).filter(x => x === "gold").length;
  setTimeout(() => {
    if (st.won && st.over) { sparkleAt(row, 140); setTimeout(() => sparkleAt($("win"), 120), 300); setMsg(""); }
    else if (golds) sparkleAt(row, golds * 10);
    if (st.over && !st.won) setMsg("");
  }, 700);
}
function hardRule(g) { // Hard: reuse everything you've learned
  const ORD = ["1st", "2nd", "3rd", "4th", "5th"];
  for (const prev of st.guesses) {
    const sc = score(prev, st.answer);
    for (let i = 0; i < LEN; i++) if (sc[i] === "gold" && g[i] !== prev[i]) return `Keep ${prev[i].toUpperCase()} in the ${ORD[i]} spot.`;
    for (let i = 0; i < LEN; i++) if (sc[i] === "pinkish" && !g.includes(prev[i])) return `Your guess must use ${prev[i].toUpperCase()}.`;
  }
  return "";
}
function shake(row) { row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake"); }
function newGame() { st = fresh(st); save(); setMsg(""); buildBoard(); render(); }

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("button") && e.key === "Enter") return;
  if (e.key === "Enter" || e.key === "Backspace") { e.preventDefault(); press(e.key); }
  else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toLowerCase());
});
$("newgame").onclick = () => { if (!st.over && st.guesses.length) { st.streak = 0; } newGame(); };

function start(data) {
  st = (data && data.st) || load();
  if (!st || !ANSWERS.includes(st.answer)) st = fresh(null);
  if (!st.level) st.level = level;
  level = st.level;
  starCeiling($("levels"), LEVELS, level, id => {
    level = id; saveLevel(LVL_KEY, id);
    if (!st.over && st.guesses.length) st.streak = 0;
    newGame(); setMsg(`${LEVELS.find(l => l.id === id).name} level. New word!`);
  });
  save(); buildBoard(); render();
  window.claude?.hot?.snapshot?.(() => ({ st }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
